behavior_patterns:

  follow_the_crowd:
    observation: Occupants tend to follow others.

  exit_familiarity:
    observation: Occupants choose known exits.

  panic_response:
    observation: Panic increases evacuation delays.

  dead_end_retreat:
    observation: Occupants may move into enclosed spaces.

recommended_controls:
