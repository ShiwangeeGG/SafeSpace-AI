domain: Glossary Intelligence

usage_rules:

  definition_requests:
    action: Retrieve glossary entry first

  unknown_fire_term:
    action: Search glossary before regulations

  compliance_term:
    action: Search regulatory_terms

  fire_system_term:
    action: Search fire_protection_terms

  occupancy_term:
    action: Search occupancy_terms

reasoning_rules:

  refuge_area:
    domain: High Rise Buildings

  hydrant:
