  - Replace faulty detectors
  - Inspect wiring

long_term_actions:
  - Establish monthly testing schedule
  - Upgrade obsolete equipment

inspection_focus:
  - Detectors
  - MCPs
  - Alarm sounders
  - Control panel

related_case_studies:
  - AMRI Hospital Fire

ai_reasoning_hints:
  - Treat alarm failure as life safety issue

retrieval_keywords:
  - fire alarm
  - smoke detector

source:
  document: NBC Part 4 Fire and Life Safety