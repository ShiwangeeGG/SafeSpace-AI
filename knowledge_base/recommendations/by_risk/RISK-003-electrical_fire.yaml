risk_id: RISK-003

risk_name: Electrical Risks

category: Ignition Sources

risk_level: High

risk_description: >
Electrical faults, short circuits, overloaded
circuits, and poor maintenance may initiate fires.

why_it_is_dangerous:

- Hidden ignition source
- Rapid fire initiation
- Equipment damage

affected_occupancies:

- All Occupancies

related_compliance_gaps:

- Missing Fire Alarm
- Poor Maintenance

immediate_actions:

- Inspect electrical systems
- Remove overloaded connections

short_term_actions:

