domain: Commercial Kitchen Fire Safety

description:
  Fire safety framework governing commercial cooking operations, kitchen exhaust systems, grease management, fire suppression systems, fuel safety, and maintenance practices.

primary_hazards:
  - Grease fires
  - Cooking oil fires
  - LPG leaks
  - Exhaust duct fires
  - Appliance overheating

critical_safety_systems:
  - Exhaust Hoods
  - Grease Ducts
  - Fire Suppression Systems
  - LPG Safety Systems
  - Portable Fire Extinguishers

key_compliance_focus:
  - Grease control
  - Fire detection and suppression
  - Fuel isolation
  - Maintenance and cleaning
  - Emergency response readiness

related_rules:
