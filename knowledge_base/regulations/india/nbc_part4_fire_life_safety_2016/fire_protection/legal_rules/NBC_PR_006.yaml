rule_id: NBC-PR-006

title: Wet Riser Requirement

category: Wet Riser

applies_to:
  - High-rise buildings

requirement:
  Wet riser systems shall be installed to provide water supply for firefighting at multiple levels.

compliance_check:
  Verify riser installation and pressure.

evidence_required:
  - Hydraulic calculations
  - Testing records

risk_if_non_compliant:
  Reduced firefighting effectiveness.

source_document:
  National Building Code of India 2016 Part 4