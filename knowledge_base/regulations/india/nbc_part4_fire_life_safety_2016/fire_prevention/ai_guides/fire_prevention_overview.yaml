domain: Fire Prevention

description:
  Fire prevention encompasses the design, construction, maintenance, and operational measures used to reduce the likelihood of fire occurrence and limit fire spread within and between buildings.

primary_objectives:
  - Prevent fire ignition
  - Limit fire spread
  - Protect occupants
  - Protect property
  - Support firefighting operations

critical_components:
  - Building Separation
  - Fire Compartmentation
  - Fire Resistance
  - Shafts and Penetrations
  - Interior Finishes
  - Electrical Fire Safety
  - Hazardous Material Control

key_compliance_focus:
  - Passive fire protection
  - Fire-resistant construction
  - Fire stopping
  - Hazard isolation
  - Electrical safety

