rule_id: NBC-FP-004

title: Fire Compartmentation Requirement

category: Compartmentation

applies_to:
  - Buildings requiring compartmentation

requirement:
  Buildings shall be divided into fire compartments to restrict fire and smoke spread.

compliance_check:
  Verify compartment walls and barriers.

evidence_required:
  - Fire compartment drawings
  - Inspection records

risk_if_non_compliant:
  Fire spread across large building areas.

source_document:
  National Building Code of India 2016 Part 4