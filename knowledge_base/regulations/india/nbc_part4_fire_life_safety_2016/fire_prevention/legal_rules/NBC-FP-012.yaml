rule_id: NBC-FP-012

title: Fire Prevention Features Shall Be Maintained

category: Maintenance

applies_to:
  - All Buildings

requirement:
  Fire prevention systems and passive fire protection features shall be maintained in effective condition.

compliance_check:
  Verify inspection and maintenance records.

evidence_required:
  - Maintenance logs
  - Inspection reports

risk_if_non_compliant:
  Fire protection measures may fail when needed.

source_document:
  National Building Code of India 2016 Part 4