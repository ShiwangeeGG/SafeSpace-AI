rule_id: NBC-HR-007

title: Staircase Pressurization Requirement

category: Smoke Management

applies_to:
  - High Rise Buildings

requirement:
  Protected staircases shall be pressurized to prevent smoke infiltration.

compliance_check:
  Verify pressurization system operation.

evidence_required:
  - Testing reports
  - HVAC records

risk_if_non_compliant:
  Smoke may enter evacuation routes.

source_document:
  National Building Code of India 2016 Part 4 Annex E