domain: High Rise Building Fire Safety

description:
  High-rise building fire safety encompasses the specialized fire prevention, life safety, fire protection, evacuation, and emergency response measures required for buildings exceeding the high-rise threshold.

primary_objectives:
  - Protect occupants
  - Support evacuation
  - Facilitate firefighting operations
  - Limit fire and smoke spread
  - Improve emergency coordination

critical_components:
  - Fire Command Centre
  - Fire Fighting Shaft
  - Fireman's Lift
  - Refuge Areas
  - Smoke Management
  - Emergency Communication
  - Evacuation Strategy
  - Fire Detection Systems
  - Fire Suppression Systems

key_compliance_focus:
  - Protected evacuation routes
  - Refuge area management
  - Firefighter access
  - Smoke control
  - Emergency communication
  - System reliability

related_documents:
  - NBC Part 4 Annex E High Rise Buildings
  - NBC Part 4 Life Safety
  - NBC Part 4 Fire Protection
  - Maharashtra Fire Prevention and Life Safety Measures Act 2006
  - Maharashtra Fire Prevention and Life Safety Measures Amendment Act 2023

