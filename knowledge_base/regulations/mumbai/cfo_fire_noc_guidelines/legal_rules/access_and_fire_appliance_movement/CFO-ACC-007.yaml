rule_id: CFO-ACC-007

title: Two-Way Ramp Requirement

category: Fire Appliance Access

applies_to:
  - Buildings requiring fire appliance ramps

requirement:
  Access arrangements shall provide adequate two-way vehicle movement where specified.

compliance_check:
  Verify ramp design supports bidirectional movement.

evidence_required:
  - Traffic movement drawings
  - Site plans

risk_if_non_compliant:
  Congestion may delay emergency response.

source_document:
  Mumbai CFO Fire NOC Guidelines