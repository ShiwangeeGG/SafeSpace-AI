rule_id: CFO-FL-006

title: Fireman Control Switch Requirement

category: Emergency Controls

applies_to:
  - Fire Lifts

requirement:
  Fire lifts shall be provided with designated fireman control switches.

compliance_check:
  Verify switch installation and operation.

evidence_required:
  - Lift inspection records
  - Site verification

risk_if_non_compliant:
  Emergency responders may be unable to assume operational control.

source_document:
  Mumbai CFO Fire NOC Guidelines