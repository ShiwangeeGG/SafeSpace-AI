rule_id: CFO-FL-002

title: Fire Lift Accessibility Requirement

category: Fire Fighting Infrastructure

applies_to:
  - Buildings with Fire Lifts

requirement:
  Fire lifts shall remain accessible and available for emergency operations.

compliance_check:
  Verify access routes and lift availability.

evidence_required:
  - Site inspection
  - Building layout plans

risk_if_non_compliant:
  Emergency responders may be unable to rapidly access upper floors.

source_document:
  Mumbai CFO Fire NOC Guidelines