rule_id: CFO-OFS-005

title: Fire Protection System Testing Requirement

category: Testing

applies_to:
  - Fire Protection Systems

requirement:
  Fire protection systems shall undergo routine testing to confirm proper operation.

compliance_check:
  Verify testing records.

evidence_required:
  - Testing reports
  - Commissioning records

risk_if_non_compliant:
  Fire protection systems may fail during emergencies.

source_document:
  Mumbai CFO Fire NOC Guidelines