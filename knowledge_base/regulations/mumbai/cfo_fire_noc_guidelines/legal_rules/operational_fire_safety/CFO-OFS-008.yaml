rule_id: CFO-OFS-008

title: Fire Safety Equipment Accessibility Requirement

category: Operational Readiness

applies_to:
  - Buildings with fire safety equipment

requirement:
  Fire safety equipment shall remain accessible and free from obstruction.

compliance_check:
  Verify equipment accessibility.

evidence_required:
  - Site inspection
  - Photographs

risk_if_non_compliant:
  Delayed emergency response.

source_document:
  Mumbai CFO Fire NOC Guidelines