rule_id: CFO-FPS-010

title: Fire Protection System Maintenance Requirement

category: Maintenance

applies_to:
  - Fire Protection Systems

requirement:
  Fire protection systems shall be regularly inspected, tested, and maintained.

compliance_check:
  Verify inspection and maintenance schedules.

evidence_required:
  - Maintenance logs
  - Testing reports

risk_if_non_compliant:
  Fire protection systems may fail during emergencies.

source_document:
  Mumbai CFO Fire NOC Guidelines