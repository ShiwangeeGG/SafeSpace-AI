rule_id: CFO-FCF-003

title: Fire Check Floor Accessibility Requirement

category: Accessibility

applies_to:
  - Fire Check Floors

requirement:
  Fire check floors shall remain accessible for emergency operations.

compliance_check:
  Verify access routes remain available.

evidence_required:
  - Site inspection
  - Floor plans

risk_if_non_compliant:
  Emergency operations may be delayed.

source_document:
  Mumbai CFO Fire NOC Guidelines