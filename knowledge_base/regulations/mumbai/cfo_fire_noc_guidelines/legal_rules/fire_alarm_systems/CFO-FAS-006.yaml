rule_id: CFO-FAS-006

title: Kitchen Detection Requirement

category: Specialized Detection

applies_to:
  - Commercial Kitchens
  - Cooking Areas

requirement:
  Appropriate fire detection devices shall be installed in kitchen and cooking areas.

compliance_check:
  Verify detector suitability and operation.

evidence_required:
  - Detection system drawings
  - Inspection records

risk_if_non_compliant:
  Delayed detection of cooking-related fires.

source_document:
  Mumbai CFO Fire NOC Guideliness