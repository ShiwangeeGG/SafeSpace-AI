rule_id: CFO-STAIR-004

title: Openable Ventilation Requirement

category: Ventilation

applies_to:
  - Staircases with natural ventilation provisions

requirement:
  Openable ventilation openings shall remain functional and accessible.

compliance_check:
  Verify operation and condition of ventilation openings.

evidence_required:
  - Site inspection
  - Maintenance records

risk_if_non_compliant:
  Reduced smoke removal capability.

source_document:
  Mumbai CFO Fire NOC Guidelines