rule_id: CFO-ER-002

title: Corridor Pressurization Requirement

category: Smoke Control

applies_to:
  - High Rise Buildings
  - Buildings requiring smoke protection

requirement:
  Corridors forming part of escape routes shall be provided with pressurization systems where specified.

compliance_check:
  Verify corridor pressurization operation.

evidence_required:
  - HVAC testing reports
  - Inspection records

risk_if_non_compliant:
  Smoke may infiltrate evacuation routes.

source_document:
  Mumbai CFO Fire NOC Guidelines