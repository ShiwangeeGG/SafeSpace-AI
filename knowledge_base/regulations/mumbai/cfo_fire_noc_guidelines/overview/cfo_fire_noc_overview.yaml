domain: Mumbai CFO Fire NOC Guidelines

description:
  Mumbai CFO Fire NOC Guidelines define operational,
  structural, evacuation, and fire protection
  requirements that are verified during fire safety
  inspections and NOC approvals.

primary_objectives:
  - Support firefighting operations
  - Protect occupants
  - Ensure evacuation safety
  - Maintain operational readiness

critical_components:
  - Access and Fire Appliance Movement
  - Basement Fire Safety
  - Electrical Fire Safety
  - Emergency Communication
  - Escape Routes
  - Staircase Safety
  - Fire Alarm Systems
  - Fire Check Floors
  - Fire Control Room
  - Fire Lifts
  - Fire Protection Systems
  - Operational Fire Safety
  - Refuge Areas