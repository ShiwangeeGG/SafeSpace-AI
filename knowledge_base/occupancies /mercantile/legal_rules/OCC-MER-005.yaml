rule_id: OCC-MER-005

occupancy_group: Mercantile

rule_category: Occupancy Risk Characteristics

occupancy_definition: >
  Mercantile occupancies present elevated
  fire risk due to high public occupancy,
  combustible merchandise, and complex
  evacuation requirements.

applies_to:
  - All Mercantile Occupancies

occupancy_characteristics:
  - Public access
  - High footfall
  - Combustible contents
  - Variable occupancy levels

primary_fire_safety_concern:
  Life safety and crowd evacuation.

related_nbc_domains:
  - Fire Protection
  - Means of Escape
  - Life Safety

retrieval_keywords:
  - mercantile risk
  - shopping mall risk
  - retail fire risk

source:
  document: NBC Part 4 Fire and Life Safety
  occupancy_group: Mercantile