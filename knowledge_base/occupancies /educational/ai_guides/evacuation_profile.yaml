occupancy_name: Educational

occupancy_category: Educational Occupancy

description: >
Educational occupancies present unique evacuation
challenges because occupants may include children,
teenagers, or large student populations that require
coordinated evacuation procedures.

examples:

- Schools
- Coaching Centres
- Colleges
- Universities

occupancy_characteristics:

- Group-based movement
- Dependence on staff guidance
- Classroom clustering
- High corridor occupancy

primary_fire_safety_concerns:

- Child evacuation
- Staircase congestion
- Delayed response
- Panic behaviour

common_fire_risks:

- Blocked exits
- Occupancy overload
- Inadequate emergency planning
- Poor emergency communication

evacuation_complexity: Very High

risk_level: Critical

related_case_studies:

- Surat Coaching Centre Fire
- Dabwali School Fire
- Kumbakonam School Fire

related_risk_patterns:

- blocked_exits_risks
- evacuation_failures
- occupancy_overload_risks

recommended_focus_areas:

- Fire drills
- Emergency lighting
- Exit signage
- Staircase management
- Teacher emergency training

retrieval_keywords:

- school evacuation
- classroom evacuation
- child safety
- student evacuation
- educational emergency

source:
document: NBC Part 4 Fire and Life Safety
occupancy_group: Educational
