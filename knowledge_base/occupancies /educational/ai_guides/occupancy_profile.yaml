occupancy_name: Educational

occupancy_category: Educational Occupancy

description: >
Buildings used for teaching, training, learning,
research, and educational activities. These occupancies
typically contain students, teachers, administrators,
and support staff.

examples:

- Schools
- Colleges
- Universities
- Coaching Institutes
- Training Centres
- Vocational Institutes
- Research Institutions

occupancy_characteristics:

- High student population
- Classroom-based activities
- Scheduled occupancy periods
- Age-dependent occupant behaviour
- Group movement patterns

