occupancy_name: Educational

occupancy_category: Educational Occupancy

description: >
Educational occupancies experience elevated fire risk
when evacuation planning, occupancy management,
and fire protection systems are inadequate. Children
and students often require additional guidance during
emergencies.

examples:

- Schools
- Colleges
- Coaching Institutes
- Training Centres

occupancy_characteristics:

- High student density
- Fixed classroom layouts
- Shared circulation paths
- Scheduled occupancy peaks

primary_fire_safety_concerns:

- Student safety
- Delayed evacuation
- Classroom entrapment
- Smoke exposure

common_fire_risks:

- Electrical faults
- Combustible roofing
- Temporary structures
- Kitchen fires
- Maintenance deficiencies

evacuation_complexity: High

risk_level: High

related_case_studies:

- Surat Coaching Centre Fire
- Kumbakonam School Fire
- Dabwali School Fire

related_risk_patterns:

- combustible_materials
- electrical_risks
- evacuation_failures
- occupancy_overload_risks
- maintenance_failures

recommended_focus_areas:

- Fire protection systems
- Occupancy control
- Exit route inspections
- Staff preparedness
- Emergency drills

retrieval_keywords:

- educational fire risk
- school fire safety
- coaching centre fire risk
- student safety
- classroom fire risk

source:
document: NBC Part 4 Fire and Life Safety
occupancy_group: Educational
