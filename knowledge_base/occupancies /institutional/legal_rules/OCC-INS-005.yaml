rule_id: OCC-INS-005

occupancy_group: Institutional

rule_category: Occupancy Risk Characteristics

occupancy_definition: >
  Institutional occupancies present
  elevated life-safety risks because
  many occupants may require assistance
  during emergencies.

applies_to:
  - All Institutional Occupancies

occupancy_characteristics:
  - Vulnerable occupants
  - Sleeping occupants
  - Assisted evacuation

primary_fire_safety_concern:
  Protection of occupants unable to
  evacuate independently.

related_nbc_domains:
  - Life Safety
  - Fire Protection
  - Emergency Communication

retrieval_keywords:
  - institutional risk
  - vulnerable occupants
  - assisted evacuation

source:
  document: NBC Part 4 Fire and Life Safety
  occupancy_group: Institutional