rule_id: OCC-INS-003

occupancy_group: Institutional

rule_category: Rehabilitation and Care Facilities

occupancy_definition: >
  Facilities providing treatment,
  rehabilitation, supervision,
  or assisted living services.

applies_to:
  - Rehabilitation Centres
  - Care Homes
  - Assisted Living Facilities

occupancy_characteristics:
  - Mobility limitations
  - Assisted evacuation requirements
  - Continuous supervision

primary_fire_safety_concern:
  Safe evacuation of vulnerable occupants.

related_nbc_domains:
  - Means of Escape
  - Life Safety
  - Emergency Communication

retrieval_keywords:
  - rehabilitation centre
  - care facility
  - assisted living

source:
  document: NBC Part 4 Fire and Life Safety
  occupancy_group: Institutional