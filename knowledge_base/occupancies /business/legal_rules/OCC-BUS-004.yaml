rule_id: OCC-BUS-004

occupancy_group: Business

rule_category: High-Rise Business Occupancies

occupancy_definition: >
Business occupancies located within high-rise
office towers and multi-storey office complexes.

applies_to:

- Office Towers
- Business Parks
- Commercial Office Complexes

occupancy_characteristics:

- Large occupant population
- Multiple floors
- Dependence on fire lifts
- Complex evacuation requirements

