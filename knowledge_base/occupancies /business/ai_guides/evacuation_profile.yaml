occupancy_name: Business

occupancy_category: Office and Administrative Occupancy

description: >
Business occupancies generally have predictable
occupant movement patterns, but evacuation becomes
increasingly complex in high-rise office buildings.

examples:

- Corporate Offices
- Business Towers
- IT Parks
- Government Buildings

occupancy_characteristics:

- Organized workspaces
- Familiar occupants
- Multi-floor occupancy
