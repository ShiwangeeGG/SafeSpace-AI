occupancy_name: Business

occupancy_category: Office and Administrative Occupancy

description: >
Buildings used primarily for business transactions,
administration, professional services, record keeping,
financial services, management activities, and office
operations.

examples:

- Corporate Offices
- IT Companies
- Banks
- Government Offices
- Consulting Firms
- Administrative Buildings
- Business Parks
- Financial Institutions

occupancy_characteristics:

- Moderate occupant density
- Daytime peak occupancy
- High dependence on electrical systems
- Extensive computer and server usage
- Large open office layouts

primary_fire_safety_concerns:

- Electrical fire hazards
- Smoke spread through office floors
- Evacuation of large office populations
- Protection of critical records and IT systems

