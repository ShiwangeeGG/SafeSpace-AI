rule_id: OCC-RES-005

occupancy_group: Residential

rule_category: Occupancy Risk Characteristics

occupancy_definition: >
  Residential occupancies face elevated
  life-safety risk due to sleeping occupants,
  delayed fire discovery, and dependence on
  evacuation through common routes.

applies_to:
  - All Residential Occupancies

occupancy_characteristics:
  - Continuous occupancy
  - Domestic fire sources
  - Shared escape routes

primary_fire_safety_concern:
  Prevention of smoke-related fatalities.

related_nbc_domains:
  - Life Safety
  - Fire Protection
  - Means of Escape

retrieval_keywords:
  - residential fire risk
  - apartment fire
  - housing society fire

source:
  document: NBC Part 4 Fire and Life Safety
  occupancy_group: Residential