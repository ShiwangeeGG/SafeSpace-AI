occupancy_name: Assembly

occupancy_category: Public Gathering Occupancy

description: >
Buildings or portions of buildings where groups of
people gather for entertainment, recreation, social,
religious, cultural, transportation, dining, or
similar purposes.

examples:

- Auditoriums
- Cinemas
- Theatres
- Restaurants
- Banquet Halls
- Marriage Halls
- Convention Centres
- Exhibition Halls
- Religious Buildings
- Stadiums
- Airport Passenger Terminals
- Railway Stations

occupancy_characteristics:

- High occupant density
- Public access
- Dynamic crowd movement
- Event-based occupancy variation
- Large gathering potential

primary_fire_safety_concerns:

- Mass evacuation
- Crowd management
- Exit accessibility
- Smoke control
- Occupancy overload

common_fire_risks:

- Blocked exits
- Occupancy overload
- Combustible decorations
- Kitchen fires
- Electrical faults

