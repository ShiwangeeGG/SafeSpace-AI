rule_id: OCC-MIX-005

occupancy_group: Mixed

rule_category: Occupancy Risk Characteristics

occupancy_definition: >
  Mixed occupancies often inherit the risks
  of all occupancy groups present within
  the building.

applies_to:
  - All Mixed Occupancies

occupancy_characteristics:
  - Multiple fire risk profiles
  - Multiple evacuation profiles
  - Complex compliance requirements

primary_fire_safety_concern:
  Identifying and managing the most restrictive
  fire safety requirements.

related_nbc_domains:
  - Occupancy Classification
  - Fire Protection
  - Life Safety

retrieval_keywords:
  - mixed occupancy risk
  - mixed use building
  - occupancy classification

source:
  document: NBC Part 4 Fire and Life Safety
  occupancy_group: Mixed