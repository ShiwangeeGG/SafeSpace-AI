rule_id: OCC-MIX-003

occupancy_group: Mixed

rule_category: Occupancy Risk Interaction

occupancy_definition: >
  Different occupancies within a building
  may introduce different fire hazards
  and evacuation challenges.

applies_to:
  - Residential + Retail
  - Office + Assembly
  - Hotel + Commercial

occupancy_characteristics:
  - Multiple risk sources
  - Different occupant behaviours
  - Different operating hours

primary_fire_safety_concern:
  Managing interactions between occupancy risks.

