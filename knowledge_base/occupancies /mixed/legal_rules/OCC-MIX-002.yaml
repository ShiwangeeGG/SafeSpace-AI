rule_id: OCC-MIX-002

occupancy_group: Mixed

rule_category: Occupancy Separation

occupancy_definition: >
  Mixed occupancies may require separation
  between different occupancy groups to
  limit fire and smoke spread.

applies_to:
  - Retail + Residential
  - Office + Mercantile
  - Assembly + Mercantile

occupancy_characteristics:
  - Shared building envelope
  - Separate occupancy zones
  - Compartmentation requirements

primary_fire_safety_concern:
  Preventing fire spread between occupancies.

related_nbc_domains:
  - Fire Prevention
  - Compartmentation
  - Fire Resistance

retrieval_keywords:
  - occupancy separation
  - compartmentation
  - fire barrier

source:
  document: NBC Part 4 Fire and Life Safety
  occupancy_group: Mixed