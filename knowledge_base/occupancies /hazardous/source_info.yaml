source_id: OCC-HAZ-SRC-001

source_name: Hazardous Occupancy Knowledge Base

occupancy_group: Hazardous

regulatory_source:

- NBC 2016 Part 4 Fire and Life Safety

purpose: >
Define hazardous occupancies involving the
storage, processing, handling, or manufacture
of flammable, explosive, toxic, corrosive,
or otherwise hazardous materials.

