graph_id: KB-GRAPH-001

graph_name: SafeSpace_AI Fire Safety Knowledge Graph

description: >
  Defines semantic relationships between
  occupancies, risks, regulations,
  incidents, fire safety systems,
  recommendations, and local context.
  Used to support multi-hop retrieval
  and AI reasoning.

entity_types:

  - Occupancy
  - Risk
  - Regulation
  - Recommendation
  - FireSystem
  - Incident
  - Location
  - ComplianceGap

