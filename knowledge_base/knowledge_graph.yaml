recommendation_chains:

  blocked_exit_chain:

    risk:
      blocked_exits_risks

    consequences:
      - evacuation_failures
      - fatality_risk

    recommendations:
      - clear_exit_routes
      - install_exit_signage
      - conduct_evacuation_drills

  smoke_spread_chain:

    risk:
      smoke_spread_risks

    consequences:
      - occupant_asphyxiation
      - delayed_evacuation

    recommendations:
      - install_smoke_management_system
      - improve_compartmentation
      - maintain_fire_doors

  electrical_fire_chain:

    risk:
      electrical_risks

    consequences:
      - ignition
      - fire_spread

    recommendations:
      - electrical_audits
      - preventive_maintenance
      - thermal_scanning

retrieval_paths:

  compliance_assessment:

    flow:
      - occupancy
      - regulation
      - compliance_gap
      - recommendation

  risk_assessment:

    flow:
      - occupancy
      - risk
      - incident_insight
      - recommendation

  incident_analysis:

    flow:
      - incident
      - risk
      - recommendation

  local_guidance:

    flow:
      - location
      - regulation
      - occupancy
      - recommendation

ai_reasoning_goal: >
  Enable SafeSpace_AI to connect
  occupancies, regulations, incidents,
  risks, systems, compliance gaps,
  and recommendations through
  structured relationships and
  multi-hop retrieval.