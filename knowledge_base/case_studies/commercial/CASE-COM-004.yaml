summary: >
A fire occurred within an electrical service duct
inside Times Tower at Kamala Mills. The fire spread
vertically through utility shafts and external facade
elements, demonstrating the risks associated with
service penetrations and facade fire spread.

root_causes:

- Electrical short circuit
- Utility shaft ignition
- Vertical flame propagation

