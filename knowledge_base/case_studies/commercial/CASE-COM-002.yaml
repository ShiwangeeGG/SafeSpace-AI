lessons_learned:

- Improve smoke compartmentation
- Protect hospitals from adjacent occupancy hazards
- Enhance evacuation planning for vulnerable occupants
- Strengthen emergency coordination procedures

prevention_recommendations:

- Smoke extraction systems
- Compartmentation audits
- Hospital evacuation drills
- Continuous fire system monitoring
