incident_type:

- Fire

severity: Critical

fatalities: 14

injuries: 55

summary: >
A major fire occurred at Mojo's Bistro and 1 Above
restaurants within Kamala Mills Compound. The fire
originated from burning hookah embers and rapidly
spread through combustible rooftop decorations and
temporary structures. Multiple fire safety failures
significantly increased casualties.

root_causes:

- Hookah embers ignited combustible decorations
- Presence of combustible bamboo structures
- Extensive use of tarpaulin roofing
- Unauthorized rooftop modifications

fire_safety_failures:

- Blocked emergency exits
- Inadequate means of escape
- Missing sprinkler protection
- Lack of effective smoke management
- Poor crowd evacuation
- Excess combustible interior materials

