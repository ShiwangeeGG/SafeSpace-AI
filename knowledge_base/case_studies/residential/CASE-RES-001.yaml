summary: >
A major fire occurred in a residential high-rise
building. The fire spread rapidly through common
areas and escape routes. Investigations highlighted
blocked staircases, poor maintenance of fire safety
systems, and challenges in occupant evacuation.

root_causes:

- Electrical ignition source
- Combustible materials in common areas

fire_safety_failures:

- Blocked staircases
- Inaccessible refuge areas
- Poor maintenance of fire systems
- Obstructed evacuation routes

affected_systems:

- Staircase Safety
- Escape Routes
- Refuge Areas
- Operational Fire Safety

risk_patterns:

- Staircase obstruction
- High-rise evacuation challenges
- Delayed emergency response

