lessons_learned:

- Maintain unobstructed staircases
- Keep refuge areas accessible
- Conduct periodic inspections
- Improve resident awareness

prevention_recommendations:

- Staircase audits
- Fire drills
- Fire alarm maintenance
- Refuge area inspections
