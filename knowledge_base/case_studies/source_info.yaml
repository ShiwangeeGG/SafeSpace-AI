source_id: CASE-STUDIES-001

source_name: Fire Incident Case Studies Repository

source_type: Historical Fire Incident Knowledge Base

knowledge_layer: Case Studies

purpose: >
Capture real-world fire incidents and map them to
fire safety failures, compliance deficiencies,
evacuation challenges, risk patterns, and lessons
learned. The repository serves as an experiential
layer that complements regulations and standards
within SafeSpace_AI.

