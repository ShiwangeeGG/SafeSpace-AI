document_summary: >
This repository contains historical fire incidents
categorized by occupancy type and analyzed through
a fire safety and compliance lens. Each case study
identifies causes, failures, affected systems,
lessons learned, and applicable regulatory domains.
The repository enables SafeSpace_AI to connect real
incidents with regulations, helping users understand
not only what the rules require, but why those rules
exist and how failures have led to real-world
consequences.
