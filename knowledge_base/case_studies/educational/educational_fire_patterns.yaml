- Fire Protection Systems
- Operational Fire Safety
- Emergency Communication

recommended_controls:

- Fire drills
- Occupancy management
- Fire alarms
- Emergency lighting
- Exit route inspections

common_regulatory_domains:

- Educational Occupancy
- Means of Escape
- Fire Protection
- Life Safety
