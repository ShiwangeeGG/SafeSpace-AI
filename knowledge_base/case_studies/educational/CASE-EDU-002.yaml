severity: Catastrophic

fatalities: 442

injuries: 100+

summary: >
A devastating fire occurred during a school annual
function held inside a temporary tent structure.
The fire rapidly spread through highly combustible
tent materials, causing panic and a deadly crowd crush
as occupants attempted to escape through limited exits.

root_causes:

- Electrical short circuit
- Ignition of synthetic tent materials
- Rapid flame spread through temporary structure

fire_safety_failures:

- Inadequate emergency exits
- Temporary combustible construction
- Overcrowding
- Lack of emergency evacuation planning
- No fire protection equipment

