- Kitchen fire exposure
- Combustible roofing
- Child evacuation challenges
- Occupancy overload
- Delayed evacuation

occupancy_risks:

- Young children
- Limited emergency awareness
- High classroom density
- Single building evacuation dependency

fatality_mechanism:

- Burns
- Smoke Inhalation

