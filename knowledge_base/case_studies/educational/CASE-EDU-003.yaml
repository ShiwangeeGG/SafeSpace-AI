- Fire Protection Systems

related_nbc_domains:

- Educational Occupancy
- Fire Prevention
- Means of Escape
- Life Safety

lessons_learned:

- Eliminate combustible roofing materials
- Separate kitchens from classrooms
- Improve school evacuation planning
- Install fire protection systems
- Reduce classroom overcrowding

prevention_recommendations:

- Fire-resistant construction
- Fire alarms
- School fire drills
- Kitchen fire suppression systems
- Emergency exits

