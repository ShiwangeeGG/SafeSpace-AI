case_id: CASE-EDU-003

incident_name: Kumbakonam School Fire

incident_date: 2004-07-16

location:
city: Kumbakonam
state: Tamil Nadu
country: India

occupancy_type: Educational

building_type:

- Primary School

incident_type:

- Fire

severity: Catastrophic

fatalities: 94

injuries: 18

summary: >
A fire started in a school kitchen and rapidly spread
to classrooms through highly combustible thatched
roofing. Young students became trapped inside
overcrowded classrooms, resulting in one of India's
deadliest school fire disasters.

root_causes:

- Kitchen fire
- Open flame cooking activity
- Combustible thatched roofing
- Rapid fire spread to classrooms

fire_safety_failures:

- Combustible construction materials
- Inadequate exits
- Overcrowded classrooms
- Poor emergency preparedness
- Lack of fire protection systems

