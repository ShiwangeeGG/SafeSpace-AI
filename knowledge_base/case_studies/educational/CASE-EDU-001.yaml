summary: >
A major fire occurred at a coaching centre operating
on the upper floors of a commercial building. The fire
spread rapidly through temporary structures and
combustible roofing materials. Many students became
trapped due to inadequate evacuation provisions.

root_causes:

- Electrical short circuit
- Combustible roofing materials
- Temporary structures
- Rapid smoke development

